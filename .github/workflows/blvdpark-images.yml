name: Build and push BLVD Park images

on:
  push:
    branches:
      - "**"
    paths:
      - "blvd-park-website/**"
      - ".github/workflows/blvdpark-images.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image: ghcr.io/${{ github.repository_owner }}/blvdpark-frontend
            context: blvd-park-website
            file: blvd-park-website/Dockerfile.frontend
          - service: api
            image: ghcr.io/${{ github.repository_owner }}/blvdpark-api
            context: blvd-park-website/backend
            file: blvd-park-website/backend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:${{ github.ref_name }}
          build-args: |
            PUBLIC_API_URL=https://blvdpark.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

